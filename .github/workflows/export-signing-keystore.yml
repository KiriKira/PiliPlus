name: Export PiliPlus signing keystore

on:
  workflow_dispatch:
    inputs:
      age_recipient:
        description: "age recipient (age1... or supported SSH public key)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Encrypted signing-key export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PILI_SIGNING_SHA256: "B8:19:28:5C:5A:86:29:83:2A:A2:90:E2:47:62:2F:94:99:18:BA:6F:28:CC:D4:F8:BE:14:EC:28:ED:7A:3E:57"
      AGE_RECIPIENT: ${{ inputs.age_recipient }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore legacy signing-key cache
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: piliplus-kirikira-signing-v1
          fail-on-cache-miss: true

      - name: Verify cached signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"

          fingerprint="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"

          if [ "$fingerprint" != "$PILI_SIGNING_SHA256" ]; then
            echo "::error::Cached keystore does not match the pinned PiliPlus signing certificate."
            echo "Expected: $PILI_SIGNING_SHA256"
            echo "Actual:   $fingerprint"
            exit 1
          fi

      - name: Encrypt keystore for the requested recipient
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          mkdir -p export
          age -r "$AGE_RECIPIENT" \
            -o export/piliplus-release.keystore.age \
            "$HOME/.android/debug.keystore"
          sha256sum export/piliplus-release.keystore.age > export/SHA256SUMS.txt

      - name: Upload encrypted export
        uses: actions/upload-artifact@v7
        with:
          name: piliplus-signing-keystore-encrypted
          path: export/
          archive: false
          if-no-files-found: error
          retention-days: 1
