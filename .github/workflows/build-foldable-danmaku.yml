name: Build Foldable Danmaku

on:
  push:
    branches:
      - feature/foldable-danmaku-camera-avoidance
    paths-ignore:
      - android/custom-signing.sha256
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foldable-danmaku-${{ github.ref }}
  cancel-in-progress: true

env:
  PILI_VERSION_CODE: "2100000000"
  PILI_SIGNING_SHA256: "B8:19:28:5C:5A:86:29:83:2A:A2:90:E2:47:62:2F:94:99:18:BA:6F:28:CC:D4:F8:BE:14:EC:28:ED:7A:3E:57"

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Restore legacy signing-key cache
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: piliplus-kirikira-signing-v1

      - name: Restore signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PILIPLUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PILIPLUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PILIPLUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PILIPLUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          secret_count=0
          [ -n "$KEYSTORE_BASE64" ] && secret_count=$((secret_count + 1))
          [ -n "$KEYSTORE_PASSWORD" ] && secret_count=$((secret_count + 1))
          [ -n "$KEY_ALIAS" ] && secret_count=$((secret_count + 1))
          [ -n "$KEY_PASSWORD" ] && secret_count=$((secret_count + 1))

          if [ "$secret_count" -ne 0 ] && [ "$secret_count" -ne 4 ]; then
            echo "::error::PiliPlus signing secrets are only partially configured."
            exit 1
          fi

          if [ "$secret_count" -eq 4 ]; then
            keystore="$RUNNER_TEMP/piliplus-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
            signing_source="repository-secrets"
          else
            keystore="$HOME/.android/debug.keystore"
            if [ "${{ steps.signing-cache.outputs.cache-hit }}" != "true" ] || [ ! -f "$keystore" ]; then
              echo "::error::Repository signing secrets are not configured and the pinned legacy keystore cache is unavailable."
              echo "::error::Refusing to generate a replacement key."
              exit 1
            fi
            store_password="android"
            key_alias="androiddebugkey"
            key_password="android"
            signing_source="legacy-cache"
            echo "::warning::Using pinned legacy signing cache until Repository Secrets migration is completed."
          fi

          fingerprint="$(keytool -list -v \
            -keystore "$keystore" \
            -storepass "$store_password" \
            -alias "$key_alias" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"

          if [ "$fingerprint" != "$PILI_SIGNING_SHA256" ]; then
            echo "::error::Signing key does not match the permanently pinned PiliPlus certificate."
            echo "Expected: $PILI_SIGNING_SHA256"
            echo "Actual:   $fingerprint"
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$store_password
          keyAlias=$key_alias
          keyPassword=$key_password
          EOF

          {
            echo "SIGNING_FINGERPRINT=$fingerprint"
            echo "SIGNING_KEY_SOURCE=$signing_source"
          } >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project and dependency patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set fixed downgrade-friendly version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define-from-file=pili_release.json --no-pub

      - name: Verify actual APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          expected="$(printf '%s' "$PILI_SIGNING_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apksigner" verify --verbose "$file"

            actual="$(keytool -printcert -jarfile "$file" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -n 1 |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]')"

            echo "$file signer SHA-256: $actual"
            if [ -z "$actual" ]; then
              echo "::error::Could not read the APK signing certificate fingerprint."
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::APK signer differs from the permanently pinned signing key."
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
          done

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')"
            mv "$file" "PiliPlus_foldable_danmaku_${{ env.version }}_${abi}.apk"
          done

      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliPlus-foldable-danmaku-arm64-v8a
          path: PiliPlus_foldable_danmaku_*_arm64-v8a.apk

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="foldable-danmaku-${version}"
          title_version="${version%%+*}"
          notes=$(cat <<'EOF'
          Custom PiliPlus build based on upstream 2.1.5.

          - Foldable / large-screen fullscreen playback: scrolling danmaku is shifted below the front-camera display cutout.
          - Static / centered danmaku keeps its original position.
          - APKs are signed with the permanently pinned PiliPlus fork signing key.
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" PiliPlus_foldable_danmaku_*.apk --clobber
          else
            gh release create "$tag" \
              PiliPlus_foldable_danmaku_*.apk \
              --target "$GITHUB_SHA" \
              --title "PiliPlus ${title_version} Foldable Danmaku" \
              --notes "$notes"
          fi
