name: Release Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

env:
  PILI_VERSION_CODE: "2100000000"
  PILI_RELEASE_VERSION_NAME: "2.1.6.2"
  PILI_SIGNING_SHA256: "6C:E8:0D:24:4E:5B:E2:75:36:9B:46:DF:A6:04:05:A8:91:72:58:F8:FD:91:64:5F:44:FE:31:B1:BD:32:90:04"

jobs:
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Restore and verify signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PILIPLUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PILIPLUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PILIPLUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PILIPLUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          keystore="$RUNNER_TEMP/piliplus-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          fingerprint="$(keytool -list -v \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"

          if [ "$fingerprint" != "$PILI_SIGNING_SHA256" ]; then
            echo "::error::Signing key does not match the pinned PiliPlus certificate."
            echo "Expected: $PILI_SIGNING_SHA256"
            echo "Actual:   $fingerprint"
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project and dependency patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Prepare release metadata
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build release APK
        shell: bash
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name "$PILI_RELEASE_VERSION_NAME" \
            --build-number "$PILI_VERSION_CODE" \
            --dart-define-from-file=pili_release.json \
            --no-pub

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          file="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          "$apksigner" verify --verbose "$file"

          expected="$(printf '%s' "$PILI_SIGNING_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual="$(keytool -printcert -jarfile "$file" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]')"

          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signer differs from the pinned signing key."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "PiliPlus_${PILI_RELEASE_VERSION_NAME}_arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliPlus-${{ env.PILI_RELEASE_VERSION_NAME }}-arm64-v8a
          path: PiliPlus_${{ env.PILI_RELEASE_VERSION_NAME }}_arm64-v8a.apk
          retention-days: 7

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${PILI_RELEASE_VERSION_NAME}"
          apk="PiliPlus_${PILI_RELEASE_VERSION_NAME}_arm64-v8a.apk"
          notes=$(cat <<'EOF'
          PiliPlus 2.1.6.2 custom release.

          - Scrolling danmaku avoids the display cutout on supported foldable / large-screen devices.
          - Static / centered danmaku keeps its original position.
          - Video-detail danmaku quick controls can be hidden from Playback Settings.
          - Android arm64-v8a only.
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "PiliPlus ${PILI_RELEASE_VERSION_NAME}" \
              --notes "$notes"
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "PiliPlus ${PILI_RELEASE_VERSION_NAME}" \
              --notes "$notes"
          fi
